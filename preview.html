<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPBCL | Modern Corporate Preview</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- React & Babel for Preview -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        :root {
            --primary: #1A3A34;
            --primary-light: #2D5A50;
            --accent: #D4A373;
            --accent-light: #E9EDC9;
            --text-dark: #1E293B;
            --text-muted: #64748B;
            --bg-light: #F8FAF9;
            --white: #FFFFFF;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.2);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            background-color: var(--bg-light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3 { font-family: 'Outfit', sans-serif; color: var(--primary); }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }
        .glass { background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); }
        
        /* Hero */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            background: linear-gradient(rgba(26, 58, 52, 0.7), rgba(26, 58, 52, 0.7)), url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            color: white;
            padding-top: 80px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
            cursor: pointer;
            border: none;
            gap: 0.5rem;
        }

        .btn-primary { background: var(--accent); color: var(--primary); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); background: var(--white); }

        /* Animation */
        .fade-in {
            animation: fadeIn 1s ease-out forwards;
            opacity: 0;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Services */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            padding: 5rem 0;
        }

        .service-card {
            background: white;
            padding: 2.5rem;
            border-radius: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            transition: var(--transition);
        }

        .service-card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.06); }
        .icon-box { color: var(--accent); margin-bottom: 1.5rem; }

        /* Navbar */
        nav {
            position: fixed;
            width: 100%;
            z-index: 1000;
            padding: 1.5rem 0;
            transition: var(--transition);
        }
        nav.scrolled { background: var(--glass-bg); backdrop-filter: blur(10px); padding: 1rem 0; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }

        /* Footer */
        footer { background: var(--primary); color: white; padding: 5rem 0 2rem; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);
            
            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={scrolled ? 'scrolled' : ''}>
                    <div className="container" style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                        <div style={{display: 'flex', alignItems: 'center', gap: '0.5rem', fontWeight: 'bold', fontSize: '1.5rem', color: scrolled ? 'var(--primary)' : 'white'}}>
                            <i data-lucide="leaf"></i> EPBCL
                        </div>
                        <div style={{display: 'flex', gap: '2rem'}}>
                            <a href="#" style={{color: scrolled ? 'var(--primary)' : 'white', textDecoration: 'none', fontWeight: '500'}}>About</a>
                            <a href="#" style={{color: scrolled ? 'var(--primary)' : 'white', textDecoration: 'none', fontWeight: '500'}}>Services</a>
                            <a href="#" style={{color: scrolled ? 'var(--primary)' : 'white', textDecoration: 'none', fontWeight: '500'}}>Contact</a>
                        </div>
                    </div>
                </nav>
            );
        };

        const Hero = () => (
            <section className="hero">
                <div className="container">
                    <div className="fade-in" style={{maxWidth: '700px'}}>
                        <h1 style={{fontSize: '4.5rem', color: 'white', marginBottom: '1.5rem', lineHeight: '1.1'}}>
                            The Future of <span style={{color: 'var(--accent)'}}>Sustainable</span> Agriculture
                        </h1>
                        <p style={{fontSize: '1.25rem', opacity: '0.9', marginBottom: '2.5rem'}}>
                            Empowering agribusinesses and smallholder farmers in Ghana through innovative consulting, business development, and climate-smart solutions.
                        </p>
                        <div style={{display: 'flex', gap: '1rem'}}>
                            <a href="#" className="btn btn-primary">Our Solutions <i data-lucide="arrow-right"></i></a>
                            <a href="#" className="btn" style={{border: '1px solid white', color: 'white'}}>Learn More</a>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Services = () => {
            const list = [
                { title: "Climate Projects", icon: "cloud-rain", desc: "Sustainable agriculture initiatives focused on resilience." },
                { title: "Farm Management", icon: "briefcase", desc: "Expert management for large and medium scale farms." },
                { title: "Training & Advisory", icon: "graduation-cap", desc: "Technical skills training for farmer groups." },
            ];

            return (
                <section style={{padding: '8rem 0'}}>
                    <div className="container">
                        <div style={{textAlign: 'center', marginBottom: '4rem'}}>
                            <h2 style={{fontSize: '2.5rem', marginBottom: '1rem'}}>Our Core Expertise</h2>
                            <p style={{color: 'var(--text-muted)'}}>Driving transformation through excellence in Ghana's agriculture.</p>
                        </div>
                        <div className="services-grid">
                            {list.map(s => (
                                <div className="service-card" key={s.title}>
                                    <div className="icon-box"><i data-lucide={s.icon} size="40"></i></div>
                                    <h3 style={{marginBottom: '1rem'}}>{s.title}</h3>
                                    <p style={{color: 'var(--text-muted)'}}>{s.desc}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Footer = () => (
            <footer>
                <div className="container">
                    <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: '3rem'}}>
                        <div>
                            <h3 style={{color: 'white', marginBottom: '1rem'}}>EPBCL</h3>
                            <p style={{opacity: '0.6', maxWidth: '300px'}}>Transforming the agricultural landscape through innovation and sustainable practices.</p>
                        </div>
                        <div style={{display: 'flex', gap: '4rem'}}>
                            <div style={{display: 'flex', flexDirection: 'column', gap: '0.8rem'}}>
                                <p style={{fontWeight: 'bold'}}>Links</p>
                                <a href="#" style={{color: 'white', opacity: '0.6', textDecoration: 'none'}}>Services</a>
                                <a href="#" style={{color: 'white', opacity: '0.6', textDecoration: 'none'}}>Impact</a>
                            </div>
                            <div style={{display: 'flex', flexDirection: 'column', gap: '0.8rem'}}>
                                <p style={{fontWeight: 'bold'}}>Contact</p>
                                <p style={{opacity: '0.6'}}>info@epbcl.com</p>
                                <p style={{opacity: '0.6'}}>Accra, Ghana</p>
                            </div>
                        </div>
                    </div>
                    <div style={{borderTop: '1px solid rgba(255,255,255,0.1)', paddingTop: '2rem', textAlign: 'center', opacity: '0.4', fontSize: '0.8rem'}}>
                        © 2024 Eastern Prime Business Consult Ltd.
                    </div>
                </div>
            </footer>
        );

        const App = () => {
            useEffect(() => {
                lucide.createIcons();
            }, []);

            return (
                <div>
                    <Navbar />
                    <Hero />
                    <Services />
                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
